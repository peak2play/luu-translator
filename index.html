<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🏳️‍🌈 Luu Translator</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>


<body>


<div class="app">


<header>

<img src="assets/logo.svg" class="logo">

<div>

<h1>
🏳️‍🌈 Luu Translator
</h1>

<p>
🇹🇭 Thai ↔ Luu Language
</p>

</div>

</header>



<main>


<section class="card">


<div class="label">
🇹🇭 ภาษาไทย
</div>



<div class="input-area">

<textarea
id="inputText"
placeholder="พิมพ์หรือกดไมค์..."
></textarea>


<button id="micBtn">
🎙️
</button>


</div>


</section>





<button id="switchBtn">
⇄
</button>





<section class="card">


<div class="label">
🏳️‍🌈 ภาษาลู
</div>



<div class="input-area">

<textarea
id="outputText"
readonly
placeholder="ผลลัพธ์..."
></textarea>


<button id="speakBtn">
🔊
</button>


</div>



<div id="stars">
☆☆☆☆☆
</div>



<div class="buttons">

<button id="copyBtn">
📋 คัดลอก
</button>


<button id="favBtn">
💗 บันทึก
</button>


</div>


</section>


</main>




<nav>

<button class="active">
🏠
</button>

<button>
🕘
</button>

<button>
💗
</button>

<button>
⚙️
</button>


</nav>



</div>



<script src="app.js"></script>


</body>

</html>
