<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luu Translator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

    <h1>🪄 Luu Translator</h1>

    <p class="subtitle">
        แปลภาษาไทย → ภาษาลู
    </p>


    <div class="card">

        <label>
            ภาษาไทย
        </label>

        <textarea
            id="thaiInput"
            placeholder="พิมพ์หรือวางข้อความที่นี่..."
        ></textarea>


        <div class="toolbar">

            <button onclick="pasteText()">
                📋 Paste
            </button>

            <button onclick="clearText()">
                ✖ Clear
            </button>

        </div>

    </div>


    <button
        class="translate-btn"
        onclick="translateLuu()">

        แปลเป็นภาษาลู

    </button>


    <div class="card">

        <label>
            ภาษาลู
        </label>


        <div
            id="result"
            class="result">

        </div>


        <div class="toolbar">

            <button onclick="copyResult()">
                📄 Copy
            </button>

        </div>


    </div>


</div>



<!-- โหลด Engine ก่อน App -->
<script src="luu_engine.js"></script>
<script src="app.js"></script>


</body>

</html>
