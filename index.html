<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luu Translator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>🪄 Luu Translator</h1>

    <p class="subtitle">
        แปลภาษาไทย → ภาษาลู
    </p>

    <div class="card">

        <label for="thaiInput">
            ภาษาไทย
        </label>

        <textarea
            id="thaiInput"
            placeholder="พิมพ์หรือวางข้อความ..."
            spellcheck="false"
            autofocus
        ></textarea>

        <div class="toolbar">

            <button
                type="button"
                onclick="pasteText()">
                📋 Paste
            </button>

            <button
                type="button"
                onclick="clearText()">
                ✖ Clear
            </button>

        </div>

    </div>

    <button
        class="translate-btn"
        type="button"
        onclick="translateLuu()">

        แปลเป็นภาษาลู

    </button>

    <div class="card">

        <label>
            ภาษาลู
        </label>

        <div
            id="result"
            class="result">
        </div>

        <div class="toolbar">

            <button
                type="button"
                onclick="copyResult()">
                📄 Copy
            </button>

        </div>

    </div>

</div>

<script src="luu_engine.js"></script>
<script src="app.js"></script>

</body>
</html>
