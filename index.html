<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏳️‍🌈 Luu Translator</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ec6fa9">

</head>


<body>


<div class="app">


<header>

<img src="assets/logo.svg" class="logo">

<div>

<h1>
🏳️‍🌈 Luu Translator
</h1>

<p>
🇹🇭 Thai ↔ Luu Language
</p>

</div>

</header>




<main>


<section class="card">

<div class="label">
🇹🇭 ภาษาไทย
</div>


<textarea
id="inputText"
placeholder="พิมพ์คำหรือประโยค..."
></textarea>


</section>




<button id="switchBtn">
⇄
</button>





<section class="card">


<div class="label">
🏳️‍🌈 ภาษาลู
</div>



<textarea
id="outputText"
placeholder="ผลลัพธ์..."
readonly></textarea>



<div id="stars">
☆☆☆☆☆
</div>




<div class="buttons">


<button id="copyBtn">
📋 คัดลอก
</button>


<button id="favBtn">
💗 บันทึก
</button>


</div>


</section>


</main>





<nav>


<button class="active">
🏠
</button>


<button>
🕘
</button>


<button>
💗
</button>


<button>
⚙️
</button>


</nav>



</div>





<script src="app.js"></script>


<script>


if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"service-worker.js"
);

}


</script>


</body>

</html>
