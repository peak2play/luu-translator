<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏳️‍🌈 Luu Translator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<h1>
🏳️‍🌈 Luu Translator
</h1>

</header>



<section class="box">


<h2>
🇹🇭 ภาษาไทย
</h2>


<textarea
id="thaiInput"
placeholder="พิมพ์หรือวางข้อความภาษาไทย..."
></textarea>


<div class="buttons">


<button id="pasteBtn">
📋 Paste
</button>


<button id="clearBtn">
🗑️ Clear
</button>


</div>


</section>





<section class="box">


<h2>
🏳️‍🌈 ภาษาลู
</h2>


<textarea
id="luuOutput"
readonly
placeholder="ผลลัพธ์..."
></textarea>



<button id="copyBtn">
📋 Copy
</button>



</section>






<div class="confidence">


ความมั่นใจ


<div id="stars">
☆☆☆☆☆
</div>


</div>





</div>



<script src="app.js"></script>


</body>

</html>
