<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Luu Translator
    </title>


    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<div class="container">


    <h1>
        🪄 Luu Translator
    </h1>


    <p class="subtitle">
        แปลภาษาไทยเป็นภาษาลู
        ด้วยระบบกฎเสียง
    </p>



    <div class="box">


        <label>
            ภาษาไทย
        </label>


        <textarea
            id="thaiInput"
            placeholder="พิมพ์ หรือวางข้อความที่นี่..."
        ></textarea>



        <div class="buttons">


            <button onclick="pasteText()">
                📋 Paste
            </button>


            <button onclick="clearText()">
                ✖ Clear
            </button>


        </div>


    </div>





    <button class="translate"
            onclick="translateLuu()">

        แปลเป็นภาษาลู

    </button>





    <div class="box result-box">


        <label>
            ภาษาลู
        </label>


        <div id="result"
             class="result">

        </div>


    </div>




    <button class="copy"
            onclick="copyResult()">

        📄 Copy

    </button>



</div>



<script src="app.js"></script>


</body>


</html>
