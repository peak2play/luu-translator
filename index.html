<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏳️‍🌈 Luu Translator</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<header>

<h1>🏳️‍🌈 Luu Translator</h1>

<p>
🇹🇭 Thai ↔ 🏳️‍🌈 Luu Language
</p>

</header>



<div class="translator">


<div class="box">


<h2>🇹🇭 ภาษาไทย</h2>


<textarea
id="inputText"
placeholder="พิมพ์ข้อความภาษาไทย..."
></textarea>



<div class="buttons">

<button id="clearBtn">
🗑 ล้าง
</button>


</div>


</div>




<button id="switchBtn" class="switch">
⇄
</button>





<div class="box">


<h2>🏳️‍🌈 ภาษาลู</h2>


<textarea
id="outputText"
placeholder="ผลลัพธ์..."
readonly>
</textarea>


<div id="info"></div>


<button id="copyBtn">
📄 คัดลอก
</button>


</div>


</div>



<footer>

Luu Translator Community Project

</footer>


</div>



<script src="app.js"></script>

</body>

</html>
